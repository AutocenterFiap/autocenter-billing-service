name: CD — Billing (Orçamento e Pagamento)

# Build/push da imagem (GHCR) e deploy automatizado no Kubernetes.
# Dispara apenas em push na main.
#
# GitHub Secrets necessários para o deploy:
#   SISTEMA_SEGURANCA_CHAVE_SECRETA — segredo HS256 do JWT (o mesmo do OS Service e do monolito)
#   MYSQL_ROOT_PASSWORD        — senha root do MySQL
#   MYSQL_USER                 — usuário da aplicação no MySQL
#   MYSQL_PASSWORD             — senha da aplicação no MySQL
#   SPRING_DATASOURCE_URL      — URL JDBC completa do MySQL
#   MERCADOPAGO_ACCESS_TOKEN   — token do Mercado Pago Checkout Pro
#   MERCADOPAGO_PUBLIC_KEY     — public key do Mercado Pago
# O deploy roda no runner self-hosted, na maquina que hospeda o cluster kind (contexto kind-autocenter).

on:
  push:
    branches:
      - main

env:
  K8S_NAMESPACE: auto-center-billing

jobs:
  docker-build-push:
    name: 🐳 Build e Push da Imagem (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir nome da imagem (lowercase) e tag
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}" >> "${GITHUB_OUTPUT}"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem Docker
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          docker build -f docker/Dockerfile \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

  deploy:
    name: 🚀 Deploy no Kubernetes (kind)
    runs-on: self-hosted
    concurrency:
      group: deploy-autocenter-billing-service
      cancel-in-progress: false
    env:
      KIND_CONTEXT: kind-autocenter
      KIND_CLUSTER: autocenter
      IMAGE_NAME: autocenter-billing-service

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Garantir que o contexto kind existe
        run: |
          if ! kubectl config get-contexts -o name | grep -qx "${KIND_CONTEXT}"; then
            echo "::error::Contexto ${KIND_CONTEXT} nao existe neste runner. Abortando antes de qualquer acao."
            exit 1
          fi

      - name: Build da imagem (tag = SHA do commit)
        run: docker build -f docker/Dockerfile -t "${IMAGE_NAME}:${{ github.sha }}" .

      - name: Carregar a imagem no kind
        run: kind load docker-image "${IMAGE_NAME}:${{ github.sha }}" --name "${KIND_CLUSTER}"

      - name: Namespace e Secret do serviço
        run: |
          kubectl --context "${KIND_CONTEXT}" apply -f k8s/namespace.yaml
          kubectl --context "${KIND_CONTEXT}" create secret generic billing-secrets \
            --namespace="${K8S_NAMESPACE}" \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --from-literal=MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            --from-literal=MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --from-literal=SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
            --from-literal=SPRING_DATASOURCE_USERNAME="${{ secrets.MYSQL_USER }}" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --from-literal=MERCADOPAGO_ACCESS_TOKEN="${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}" \
            --from-literal=MERCADOPAGO_PUBLIC_KEY="${{ secrets.MERCADOPAGO_PUBLIC_KEY }}" \
            --from-literal=SISTEMA_SEGURANCA_CHAVE_SECRETA="${{ secrets.SISTEMA_SEGURANCA_CHAVE_SECRETA }}" \
            --save-config --dry-run=client -o yaml | kubectl --context "${KIND_CONTEXT}" apply -f -

      - name: Aplicar manifestos com a imagem do commit
        run: |
          rm -rf "${RUNNER_TEMP}/k8s"
          cp -r k8s "${RUNNER_TEMP}/k8s"
          printf '\nimages:\n  - name: %s\n    newTag: "%s"\n' \
            "${IMAGE_NAME}" "${{ github.sha }}" >> "${RUNNER_TEMP}/k8s/kustomization.yaml"
          kubectl --context "${KIND_CONTEXT}" apply -k "${RUNNER_TEMP}/k8s"

      - name: Aguardar o rollout
        run: |
          kubectl --context "${KIND_CONTEXT}" -n "${K8S_NAMESPACE}" rollout status \
            deployment/autocenter-billing-service --timeout=300s
