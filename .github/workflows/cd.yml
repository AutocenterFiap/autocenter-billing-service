name: CD — Billing (Orçamento e Pagamento)

# Publica a imagem no GHCR (latest e SHA do commit) a cada push na main.
# O deploy nos clusters kind fica no job deploy do ci.yml, que so roda depois do build e do Quality Gate.

on:
  push:
    branches:
      - main

jobs:
  docker-build-push:
    name: 🐳 Build e Push da Imagem (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir nome da imagem (lowercase) e tag
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}" >> "${GITHUB_OUTPUT}"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem Docker
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          docker build -f docker/Dockerfile \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
