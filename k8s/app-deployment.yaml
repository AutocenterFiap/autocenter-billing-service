apiVersion: apps/v1
kind: Deployment
metadata:
  name: autocenter-billing-service
  namespace: auto-center-billing
  labels:
    app: autocenter-billing-service
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autocenter-billing-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: autocenter-billing-service
        component: api
      annotations:
        ad.datadoghq.com/autocenter-billing-service.checks: |
          {
            "openmetrics": {
              "instances": [
                {
                  "prometheus_url": "http://%%host%%:8099/actuator/prometheus",
                  "namespace": "autocenter_billing",
                  "metrics": [
                    "autocenter_*"
                  ]
                }
              ]
            }
          }
        ad.datadoghq.com/autocenter-billing-service.logs: |
          [
            {"source": "spring-boot", "service": "autocenter-billing-service"}
          ]
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - "-c"
            - |
              until nc -z mysql-service 3306; do
                echo "Aguardando MySQL...";
                sleep 3;
              done;
              echo "MySQL disponivel!"
      containers:
        - name: autocenter-billing-service
          image: autocenter-billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8099
              name: http
              protocol: TCP
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_ENV
              value: "prod"
            - name: DD_SERVICE
              value: "autocenter-billing-service"
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/dd-java-agent.jar"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: MERCADOPAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: MERCADOPAGO_ACCESS_TOKEN
            - name: MERCADOPAGO_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: MERCADOPAGO_PUBLIC_KEY
          envFrom:
            - configMapRef:
                name: billing-configmap
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8099
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8099
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

