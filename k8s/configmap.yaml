apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-configmap
  namespace: auto-center-billing
  labels:
    app: autocenter-billing-service
data:
  # ─── Aplicação ───────────────────────────────────────────────────
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8099"

  # ─── Kafka (cluster de mensageria compartilhado do ecossistema) ──
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # ─── Mercado Pago (Checkout Pro) ─────────────────────────────────
  MERCADOPAGO_MODO: "real"
  MERCADOPAGO_BASE_URL: "https://api.mercadopago.com"

  # ─── Logging ─────────────────────────────────────────────────────
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_BR_COM_AUTOCENTERFIAP: "INFO"

