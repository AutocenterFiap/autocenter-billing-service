apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-center-billing

resources:
  - namespace.yaml
  - configmap.yaml
  - mysql-service.yaml
  - mysql-statefulset.yaml
  - app-deployment.yaml
  - app-service.yaml
  - hpa.yaml

labels:
  - pairs:
      managed-by: kustomize
      project: autocenter-billing-service
    includeSelectors: false
    includeTemplates: true

