# ==============================================================================
# EXEMPLO DE SECRET — NAO VERSIONE CREDENCIAIS REAIS!
# ==============================================================================
# Em producao/CI-CD o Secret real ("billing-secrets") e criado via:
#   kubectl create secret generic billing-secrets --namespace=auto-center-billing \
#     --from-literal=MYSQL_ROOT_PASSWORD=... \
#     --from-literal=MYSQL_USER=billing \
#     --from-literal=MYSQL_PASSWORD=... \
#     --from-literal=SPRING_DATASOURCE_URL=... \
#     --from-literal=SPRING_DATASOURCE_USERNAME=billing \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=... \
#     --from-literal=MERCADOPAGO_ACCESS_TOKEN=... \
#     --from-literal=MERCADOPAGO_PUBLIC_KEY=...
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: billing-secrets
  namespace: auto-center-billing
  labels:
    app: autocenter-billing-service
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "change-me-root"
  MYSQL_USER: "billing"
  MYSQL_PASSWORD: "change-me-billing"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/billing?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "billing"
  SPRING_DATASOURCE_PASSWORD: "change-me-billing"
  MERCADOPAGO_ACCESS_TOKEN: "APP_USR-change-me"
  MERCADOPAGO_PUBLIC_KEY: "APP_USR-change-me"

